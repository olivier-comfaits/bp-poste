services:
  - type: web
    name: posteplan-ia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_PROVIDER
        value: auto
      - key: XAI_MODEL
        value: grok-4.6
      # Ajoutez XAI_API_KEY dans le dashboard Render (Environment) — ne la mettez pas ici.
