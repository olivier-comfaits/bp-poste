# Configuration nginx pour olivier-comfaits.fr/bp-laposte/
# À inclure dans le server {} du domaine, ou à placer dans sites-available.
# L'application Flask tourne seule sur 127.0.0.1:8080 — aucun lien avec le site principal.

location /bp-laposte/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Script-Name /bp-laposte;
    client_max_body_size 10m;
}

# Redirection sans slash final
location = /bp-laposte {
    return 301 /bp-laposte/;
}
